[package]
name = "manhattan-viewer"
version = "0.1.0"
edition = "2024"
description = "Fly-through day/night viewer for the Manhattan city model"

[dependencies]
bevy = { version = "0.20.1", features = ["jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 2

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.130"
web-sys = { version = "0.3.107", features = ["Document", "Element", "Location", "Window"] }

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manhattan — full-detail day/night city</title>
  <meta name="description" content="Fly through a full-detail Manhattan city model with real sun and moon lighting, human-scale floors, twilight waves, fog and depth of field.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Manhattan — full-detail day/night city">
  <meta property="og:description" content="A full-detail, real-time Manhattan diorama built with Rust and Bevy.">
  <meta name="theme-color" content="#05070b">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loading" class="loading">
    <div class="loader-card">
      <p class="eyebrow">Gallifrey Station / Spatial Computing</p>
      <h1>Manhattan</h1>
      <p class="sub">A full-detail, real-time city with human-scale floors, a living twilight wave, fog and depth of field.</p>
      <div class="bar"><span></span></div>
      <p class="status">Loading the full city geometry…</p>
      <p class="note">First load is about 95 MB. Desktop with mouse and keyboard recommended.</p>
      <a class="back" href="https://orbitmechanic.github.io/">← Gallifrey Station</a>
    </div>
  </div>

  <canvas id="manhattan-canvas" width="1440" height="900" tabindex="0" aria-label="Manhattan 3D city viewer"></canvas>

  <script>
  (() => {
    const Native = window.AudioContext || window.webkitAudioContext;
    if (!Native) return;
    const contexts = [];
    function Wrapped(...args) {
      const ctx = new Native(...args);
      contexts.push(ctx);
      return ctx;
    }
    Wrapped.prototype = Native.prototype;
    window.AudioContext = Wrapped;
    if (window.webkitAudioContext) window.webkitAudioContext = Wrapped;
    const resume = () => contexts.forEach((ctx) => {
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    });
    ['pointerdown', 'keydown', 'touchstart'].forEach((event) => {
      window.addEventListener(event, resume, { capture: true, passive: true });
    });
  })();
  </script>

  <script type="module">
    import init from './manhattan.js';

    const canvas = document.getElementById('manhattan-canvas');
    const loading = document.getElementById('loading');

    function focusCanvas() {
      canvas.focus({ preventScroll: true });
      requestAnimationFrame(() => window.scrollTo({ top: 0, left: 0, behavior: 'instant' }));
    }

    init().then(() => {
      focusCanvas();
      const observer = new MutationObserver(() => {
        if (loading.classList.contains('hidden')) {
          focusCanvas();
          observer.disconnect();
        }
      });
      observer.observe(loading, { attributes: true, attributeFilter: ['class'] });
    }).catch((error) => {
      console.error(error);
      loading.querySelector('.status').textContent =
        'The city failed to load. Try a desktop browser with WebGL2 enabled.';
      loading.classList.add('error');
    });
  </script>
</body>
</html>
